:root{--teal:#008578;--ink:#152927;--muted:#708280;--bg:#f4f7f7;--line:#e4ecea;--mint:#e7f5f0}*{box-sizing:border-box}body{margin:0;background:#e7ecec;color:var(--ink);font:14px/1.5 system-ui,-apple-system,'Malgun Gothic',sans-serif}.phone{max-width:430px;margin:18px auto;background:#f8faf9;min-height:min(900px,calc(100vh - 36px));box-shadow:0 18px 45px #10262322;position:relative}.top{padding:18px 20px 4px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:16px;font-weight:800;color:#173735}.logo b{display:inline-grid;place-items:center;background:var(--teal);color:#fff;border-radius:7px;width:23px;height:23px;font-size:14px;margin-right:5px}.iconbtn{border:0;background:transparent;font-size:19px;cursor:pointer}.main{padding:8px 20px 96px}h1{font-size:22px;line-height:1.28;letter-spacing:-.5px;margin:8px 0}h2{font-size:15px;margin:21px 0 11px}h3{font-size:14px;margin:2px 0}p{margin:6px 0;color:var(--muted)}.sub{font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.soft{background:var(--mint);border-radius:12px;padding:14px;margin:12px 0;color:#16645a}.warn{background:#fff3e5;color:#755021;border-radius:12px;padding:14px;font-size:12px;margin:12px 0}.btn{background:var(--teal);color:white;border:0;border-radius:9px;padding:13px 16px;width:100%;font-weight:750;cursor:pointer;margin:8px 0}.btn.alt{background:white;color:var(--teal);border:1px solid var(--teal)}.btn:active,.nav button:active{transform:scale(.99)}.smallbtn{border:1px solid var(--line);border-radius:8px;background:white;padding:7px 10px;color:var(--ink);cursor:pointer;font-size:12px}.flex{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grow{flex:1}.muted{color:var(--muted)}.tiny{font-size:11px}.statrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statrow .card{margin:0}.stat{font-size:22px;font-weight:800;color:var(--teal)}.progress{height:8px;background:#d4eae4;border-radius:10px;overflow:hidden;margin-top:11px}.progress>i{display:block;background:var(--teal);height:100%}.exercise{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:12px;padding:11px;margin:7px 0;cursor:pointer;display:flex;align-items:center;gap:12px}.exercise strong{display:block;font-size:14px}.exercise em{font-style:normal;color:var(--muted);font-size:11px}.catalog-photo{width:100%;height:100%;object-fit:cover;border-radius:9px}.reference-photo{width:calc(50% - 5px);max-height:250px;object-fit:contain;background:#f4f7f7;border-radius:9px}.source-photos{display:flex;gap:10px;margin-top:12px}.source-steps{padding-left:20px;font-size:12px;line-height:1.7}.source-steps li{margin:8px 0}.rehab-cover{width:100%;height:100%;display:grid;place-items:center;font-size:30px}.rehab-detail-placeholder{display:flex;align-items:center;justify-content:center;gap:8px;min-height:175px;flex-wrap:wrap;color:#55746e}.rehab-pose{width:calc(50% - 5px);max-height:260px;object-fit:contain;border-radius:8px}.art{width:72px;height:67px;display:grid;place-items:center;border-radius:9px;background:#eaf2f0;font-size:31px;flex-shrink:0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;cursor:pointer}.chip.active{background:var(--teal);color:white;border-color:var(--teal)}.search,input,textarea,select{font:inherit;width:100%;border:1px solid #dfe9e7;background:#fff;border-radius:9px;padding:11px;color:var(--ink)}input[type=checkbox]{width:auto;accent-color:var(--teal)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:12px;color:#4f6965;font-weight:650;display:block;margin:9px 0 5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:11px 8px 17px;background:white;border-top:1px solid var(--line)}.nav button{cursor:pointer;background:none;border:none;color:#91aaa5;font-size:11px;display:grid;gap:2px;justify-items:center}.nav button span{font-size:21px}.nav button.on{color:var(--teal);font-weight:800}.hide{display:none!important}.num{background:#e5f5f0;color:var(--teal);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:800}.step{display:flex;align-items:flex-start;gap:9px;margin:16px 0}.step p{font-size:12px;margin:0}.success{text-align:center;padding:20px 0 5px}.check{display:inline-grid;place-items:center;width:76px;height:76px;background:var(--mint);border-radius:50%;color:var(--teal);font-size:40px}.linechart{width:100%;height:auto}.row-actions{display:flex;gap:8px}.row-actions button{flex:1}.row-actions .smallbtn{font-size:11px}.notice{padding:10px 12px;border-radius:9px;background:#f0f5f4;font-size:11px;color:#5d7772}.back{border:0;background:none;padding:8px 0;cursor:pointer;color:#45645f}.pill{background:#e1f3ed;color:#007569;border-radius:20px;padding:2px 7px;font-size:10px}.stack{display:grid;gap:5px}.foot{font-size:10px;color:#7f9290;text-align:center;margin:22px 0 6px}@media(max-width:440px){body{background:#f8faf9}.phone{margin:0;min-height:100vh;box-shadow:none}.main{min-height:calc(100vh - 140px)}}

/* Rehab media = RepDB free tier, machine media = Free Exercise DB.
   The RepDB public JSON may evolve; only exact exercise-name aliases are accepted.
   Images served from RepDB CDN, no scraping of medical provider media. */
const REPDB_BASE='https://cdn.jsdelivr.net/gh/RepDB/exercise-dataset@main/';
const REPDB_JSON=REPDB_BASE+'exercises.json';
const REPDB_ALIASES={
 bird:['bird dog','bird-dog'],
 bridge:['glute bridge','bodyweight glute bridge','floor glute bridge','bridge'],
 heel:['heel slide','heel slides','supine heel slide'],
 deadbug:['dead bug','deadbug'],
 pelvic:['pelvic tilt','supine pelvic tilt','posterior pelvic tilt'],
 catcow:['cat cow','cat-cow','cat cow stretch','cat camel'],
 sitstand:['sit to stand','sit-to-stand','chair squat','chair sit to stand'],
 walking:['walking','walk']
};
let repdbPromise=null, repdbStatus='';
const repdbNorm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function repdbRows(data){if(Array.isArray(data))return data;for(const field of ['exercises','data','items'])if(Array.isArray(data?.[field]))return data[field];return Object.values(data||{}).filter(v=>v&&typeof v==='object'&&!Array.isArray(v)&&('name' in v||'name_en' in v));}
function loadRepdb(){if(!repdbPromise)repdbPromise=fetch(REPDB_JSON).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(repdbRows).then(rows=>{if(!rows.length)throw Error('JSON 데이터 형식 불일치');return rows}).catch(err=>{repdbPromise=null;throw err});return repdbPromise;}
function repdbName(rec){return rec.name_en||rec.name?.en||rec.name||rec.title_en||rec.title||'';}
function repdbImagePaths(rec){const im=rec.images?.flat||rec.images||{};const paths=[im.start,im.peak,im.main].filter(v=>typeof v==='string'&&v.length);return [...new Set(paths)].map(v=>/^https:\/\//i.test(v)?v:REPDB_BASE+v.replace(/^\/+/,''));}
async function repdbFind(id){const rows=await loadRepdb();const accepted=REPDB_ALIASES[id]||[];return {record: rows.find(e=>accepted.some(a=>repdbNorm(a)===repdbNorm(repdbName(e)))&&repdbImagePaths(e).length>0)||null,total:rows.length};}
function repdbCredit(){return '<p class="tiny"><a href="https://repdb.co" target="_blank" rel="noopener noreferrer">Exercise data and illustrations by RepDB (repdb.co)</a> · 무료판, 출처 표기 · 의료 검수 자료 아님</p>';}

async function hydrateRehab(id){

  if(info)info.innerHTML='<b>RepDB 원본과 일치</b> · '+esc(repdbName(record))+' (ID '+esc(record.id||'미표기')+')'+repdbCredit()+'<p class="tiny">이 그림은 일반 운동 예시이며 허리디스크에 안전하다는 인증은 아닙니다.</p>';
 }catch(err){const cover=document.getElementById('rehab-detail-cover'),info=document.getElementById('rehab-source-info');showRehabFallback(id,'');}
}

async function loadSourceDetails(id){

const FLOW_ALIASES={
 bird:['bird dog','bird-dog','quadruped bird dog'],
 bridge:['glute bridge','butt lift bridge','hip bridge','bridge'],
 heel:['heel slide','heel slides','supine heel slide'],
 cable_push:['triceps pushdown','cable triceps pushdown','tricep pushdown','cable pushdown'],
 cable_curl:['cable biceps curl','cable curl'],

};
let flowPromise=null,flowToken=0,flowTimer=null;
const flowNormalize=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function stopFlow(){flowToken++;if(flowTimer){clearTimeout(flowTimer);flowTimer=null;}}
function flowRecordList(x){return Array.isArray(x)?x:Array.isArray(x?.data)?x.data:Array.isArray(x?.exercises)?x.exercises:[];}
function fetchFlowCatalog(){
 if(!flowPromise)flowPromise=fetch(FLOW_JSON,{cache:'default'}).then(r=>{if(!r.ok)throw Error('데이터셋 HTTP '+r.status);return r.json()}).then(flowRecordList).then(rows=>{if(!rows.length)throw Error('데이터셋 형식 확인 필요');return rows}).catch(e=>{flowPromise=null;throw e});
 return flowPromise;
}
function flowMatch(id,rows){
 const aliases=FLOW_ALIASES[id]||[];
 return rows.find(e=>aliases.some(name=>flowNormalize(e.name)===flowNormalize(name)) && Array.isArray(e.animation?.frames) && e.animation.frames.length>=2) || null;
}
function flowStatus(html){const box=document.getElementById('flow-motion');if(box)box.innerHTML=html;}
function flowInitPlayback(id,rec,token){
 const elem=document.getElementById('flow-frame'),btn=document.getElementById('flow-play');
 if(!elem||!btn)return;
 const frames=rec.animation.frames.map(x=>FLOW_ROOT+String(x).replace(/^\/+/,''));
 const seq=Array.isArray(rec.animation.sequence)?rec.animation.sequence:[0,1,2,1];
 let delay=Math.min(2200,Math.max(160,Number(rec.animation.frameDurationMs)||650));
 const frameImages=frames.map(src=>{const im=new Image();im.src=src;return im});
 let idx=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
 function draw(){if(token!==flowToken||current!=='detail'||selected!==id)return;const num=seq[idx%seq.length];if(frames[num])elem.src=frames[num];}
 function tick(){if(token!==flowToken||!playing||current!=='detail'||selected!==id||document.hidden)return;idx++;draw();flowTimer=setTimeout(tick,delay)}
 elem.onload=()=>{const c=document.getElementById('flow-card');if(c)c.style.display='block';};elem.onerror=()=>{playing=false;if(flowTimer)clearTimeout(flowTimer);flowStatus('')};
 btn.onclick=()=>{playing=!playing;btn.textContent=playing?'일시정지':'재생';if(flowTimer)clearTimeout(flowTimer);if(playing)flowTimer=setTimeout(tick,delay)};
 btn.textContent=playing?'일시정지':'재생';draw();if(playing)flowTimer=setTimeout(tick,delay);
 const speeds=document.getElementById('flow-speeds');if(speeds){speeds.addEventListener('click',ev=>{const b=ev.target.closest('button[data-flow-rate]');if(!b)return;const rate=Number(b.dataset.flowRate);if(![0.5,0.75,1].includes(rate))return;delay=Math.round((Number(rec.animation.frameDurationMs)||650)/rate);speeds.querySelectorAll('button').forEach(btn=>btn.setAttribute('aria-pressed',String(btn===b)));if(flowTimer)clearTimeout(flowTimer);if(playing)flowTimer=setTimeout(tick,delay);})} 
 document.addEventListener('visibilitychange',()=>{if(token!==flowToken)return;if(flowTimer)clearTimeout(flowTimer);if(!document.hidden&&playing)flowTimer=setTimeout(tick,delay)},{once:false});
}
async function loadFlowAnimation(id){
 stopFlow();const token=flowToken;
 if(!FLOW_ALIASES[id])return flowStatus('');
 flowStatus('');
 try{
  const rows=await fetchFlowCatalog();
  if(token!==flowToken||current!=='detail'||selected!==id)return;
  const rec=flowMatch(id,rows);
  if(!rec)return flowStatus('');
  const name=esc(rec.name),sourceId=esc(rec.id);
  flowStatus(`<div class="card" id="flow-card" style="display:none"><b>동작 애니메이션 · Flow Exercise Dataset</b><p class="tiny muted">매칭: ${name} (ID ${sourceId}) · 운동별 자세 정확성 미검수</p><div class="flow-stage"><img id="flow-frame" alt="${name} 동작 예시 프레임"></div><div class="motion-controls"><button class="smallbtn" id="flow-play" type="button">일시정지</button><span id="flow-speeds">${[0.5,0.75,1].map(n=>`<button type="button" class="smallbtn" data-flow-rate="${n}" aria-pressed="${n===1}">${n}배</button>`).join('')}</span><a class="smallbtn" href="https://github.com/ozansozuozgit/flow-exercise-dataset" target="_blank" rel="noopener noreferrer">원본 및 사용 조건 ↗</a></div><p class="tiny">연속된 SVG 그림을 반복 표시합니다. 실제 동작 속도나 허리디스크 환자에게 적합한 자세를 의미하지 않습니다. 애니메이션의 출처 및 사용 조건은 원본 저장소에서 확인해 주세요.</p></div>`);
  flowInitPlayback(id,rec,token);
 }catch(err){if(token===flowToken)flowStatus('')}
}

const PURPOSES=[{"id":"control","title":"체간 안정화·운동 조절","description":"Cochrane의 core strengthening 및 motor control 범주 참고. 개인별 처방이나 안전성 보증은 아닙니다.","ids":["bird","bridge","deadbug"]},{"id":"mobility","title":"유연성·가동성","description":"Cochrane stretching / flexibility / mobilising 운동 분류 참고.","ids":["heel","pelvic","catcow"]},{"id":"strength","title":"일반 근력·기능 운동","description":"저항운동과 일상 움직임 예시. 머신 운동은 별도 목록에서 확인할 수 있습니다.","ids":["sitstand"]},{"id":"aerobic","title":"유산소 활동","description":"Cochrane aerobic 범주 참고. 걷기 활동 예시.","ids":["walking"]}];
function purpose(){return `<button class="back" onclick="go('home')">‹ 홈으로</button><h1>운동 목적별 탐색</h1><p class="tiny"><a target="_blank" rel="noopener noreferrer" href="https://doi.org/10.1002/14651858.CD015608">운동 유형 분류 참고: Cochrane (개별 동작 검증 자료 아님) ↗</a></p><p class="sub">운동의 일반적인 목적을 설명하는 분류입니다. 허리디스크 환자에게 안전하다는 의미가 아닙니다.</p>${PURPOSES.map(g=>`<div class="card"><h2 style="margin:2px 0">${g.title}</h2><p class="sub">${g.description}</p>${g.ids.map(id=>item(ex(id))).join('')}</div>`).join('')}<div class="warn">⚠ 운동 시작 전 담당 의료진에게 개인별 적합성을 확인하세요. 모든 콘텐츠는 전문 검수 전입니다.</div>`;}
function machineCard(m){return `<button class="exercise" onclick="selectedMachine='${m.id}';go('machine')"><div class="art">${photoOrIcon(ex(m.exerciseIds.find(id=>FEDB_IDS[id])||m.exerciseIds[0]))}</div><div class="grow"><strong>${esc(m.name)}</strong><em>${esc(m.area)} · ${m.exerciseIds.length}개 운동 예시</em><div class="tiny" style="color:var(--teal);margin-top:5px">기구별 운동 살펴보기 →</div></div></button>`}
function gym(){return `<h1>기구별 운동 찾기</h1><p class="sub">머신을 선택하면 일반적인 운동 예시가 표시됩니다. 사진은 제품 사진이 아닌 해당 머신을 활용한 동작 사진입니다.</p><input id="search" class="search" placeholder="🔎 기구·운동 이름·신체 부위 검색" oninput="drawGym()"><div class="chips" id="chips">${['전체','케이블','머신'].map(x=>`<button class="chip ${gymFilter===x?'active':''}" onclick="gymFilter='${x}';drawGym()">${x}</button>`).join('')}</div><div id="gym-items"></div><div class="warn">⚠ 이 목록은 허리디스크에 안전하다고 판정된 운동 목록이 아닙니다. 운동을 하기 전 담당 의료진에게 적합성을 확인하세요.</div>`}
function drawGym(){const term=($('#search')?.value||'').trim().toLowerCase();if($('#chips'))$('#chips').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.textContent===gymFilter));const matches=MACHINES.filter(m=>(gymFilter==='전체'||m.kind===gymFilter)&&([m.name,m.area,...m.exerciseIds.flatMap(id=>{const x=ex(id);return [x.name,x.cat]})].join(' ').toLowerCase().includes(term)));if($('#gym-items'))$('#gym-items').innerHTML=`<h2>운동 기구 ${matches.length}종 · 운동 예시 ${matches.reduce((n,m)=>n+m.exerciseIds.length,0)}개</h2>`+(matches.length?matches.map(machineCard).join(''):'<div class="card">검색 결과가 없습니다.</div>')}
function machine(){const m=MACHINES.find(x=>x.id===selectedMachine)||MACHINES[0];return `<button class="back" onclick="go('gym')">‹ 기구 목록</button><h1>${esc(m.name)}</h1><p class="sub">주요 관련 부위: ${esc(m.area)}</p><div class="card"><b>이 머신으로 할 수 있는 운동 예시</b><p class="sub">${m.exerciseIds.length}개 항목 · 전문 검수 전 콘텐츠</p></div>${m.exerciseIds.map(id=>item(ex(id))).join('')}<div class="warn">⚠ 기구에 따라 동일한 운동명이더라도 설정·궤적이 다릅니다. 아래 설명은 기구 사용에 관한 일반 정보이며 환자별 처방이 아닙니다.</div>`}
function exerciseHistoryCard(id){
 const all=records().filter(r=>r.exercise===id).sort((a,b)=>new Date(b.date)-new Date(a.date));
 const recent=all.slice(0,4);
 return `<div class="card"><div class="flex between"><b>📈 이 운동의 이전 기록</b><span class="pill">${all.length}회</span></div>
 <p class="tiny">운동별 전후 통증과 증상 기록. 안전성이나 치료 효과를 판정하지 않습니다.</p>
 ${recent.length?recent.map(r=>`<div class="notice" style="margin:7px 0"><b>${fmt(r.date)}</b> · ${r.sets}세트 × ${r.reps}회<br>통증 ${r.before} → ${r.after}점${r.symptoms?.includes('tingling')?' · 저림 기록':''}</div>`).join(''):'<p class="sub">아직 이 운동의 기록이 없습니다.</p>'}
 ${all.length>4?`<p class="tiny">최근 4개 기록만 표시</p>`:''}</div>`;
}
function detail(){const x=ex(selected);return `<button class="back" onclick="go('${x.type==='gym'?'machine':'home'}')">‹ 뒤로 가기</button><h1>${esc(x.name)}</h1><span class="pill">${esc(x.cat)}</span><div class="card optional-media-card" style="text-align:center;padding:23px"><div class="detail-cover">${x.type==='home'?`<div class="rehab-detail-placeholder" id="rehab-detail-cover"></div>`:FEDB_IDS[x.id]?`<img class="reference-photo" style="width:100%;height:240px" alt="${esc(x.name)} 운동 참고 사진" src="${photoUrl(FEDB_IDS[x.id])}" onerror="this.closest('.optional-media-card')?.remove()">`:`<div style="font-size:73px">${x.icon}</div>`}</div><p class="sub">${x.type==='home'?"":FEDB_IDS[x.id]?"Free Exercise DB 동작 사진 · 출처 표시":""}</p></div>${x.type==='gym'?motionMedia(x):''}<div id="flow-motion" aria-live="polite"></div><div id="fdb-info">${FEDB_IDS[x.id]?'':x.type==='home'?'<div id="rehab-source-info"></div>':''}</div><div id="exercise-history-panel">${exerciseHistoryCard(x.id)}</div><div class="soft"><b>📋 운동 전 확인 사항</b><p class="sub">의료진에게 운동 허용 여부를 확인하고, 통증이나 저림이 증가하면 중단하세요.</p></div><h2>운동 정보 (시연용)</h2>${x.steps.map((s,i)=>`<div class="step"><span class="num">${i+1}</span><p>${esc(s)}</p></div>`).join('')}<div class="card"><b>출처 및 검수 상태</b><p class="sub">${esc(META[x.id]?.status||"시연용")}</p><p class="tiny">아래 자료는 일반적인 운동치료 근거이며 이 개별 동작의 안전성을 인증하지 않습니다.</p>${(META[x.id]?.sources||[]).map(k=>`<p class="sub"><a target="_blank" rel="noopener noreferrer" href="${GUIDE_SOURCES[k].url}">${esc(GUIDE_SOURCES[k].label)} ↗</a></p>`).join("")}</div><div class="warn">⚠ 본 가이드는 교육용 예시이며 개인의 허리 상태에 맞춘 운동 처방이 아닙니다. 새롭거나 악화되는 신경학적 증상이 있다면 의료진에게 문의하세요.</div><button class="btn" onclick="editing=null;go('record')">오늘의 운동 피드백 기록하기 →</button>`}
function record(){let prev=editing?records().find(r=>r.id===editing):null,x=ex(prev?.exercise||selected);return `<button class="back" onclick="go('${x.type==='gym'?'machine':'home'}')">‹ 뒤로 가기</button><h1>오늘의 운동 피드백</h1><p class="sub">운동 전후 상태를 기록해 변화를 확인하세요.</p><div class="card"><b>오늘의 운동</b><p>${esc(x.name)}</p><div class="fields"><div class="field"><label>세트 수</label><input id="sets" type="number" min="1" max="100" value="${prev?.sets||3}"></div><div class="field"><label>횟수 (1세트 기준)</label><input id="reps" type="number" min="1" max="1000" value="${prev?.reps||10}"></div></div></div><div class="card"><b>통증 기록 (NRS 0~10)</b><p class="tiny">NRS는 주관적 숫자통증척도입니다. 0점은 통증 없음, 10점은 상상할 수 있는 가장 심한 통증을 뜻합니다.</p><div class="fields"><div class="field"><label>운동 전 통증</label><input id="before" type="number" min="0" max="10" value="${prev?.before??2}"></div><div class="field"><label>운동 후 통증</label><input id="after" type="number" min="0" max="10" value="${prev?.after??3}"></div></div><p class="tiny">같은 사람의 자기보고 점수입니다. 회복률이나 의학적 진단으로 해석하지 않습니다.</p></div><div class="card"><b>운동 후 증상</b><div class="stack" style="margin-top:9px">${[['tingling','다리 저림'],['back','허리 불편감'],['none','특이사항 없음']].map(([k,label])=>`<label><input type="checkbox" id="${k}" ${prev?.symptoms?.includes(k)?'checked':''}> ${label}</label>`).join('')}</div><div class="field"><label>메모 (선택)</label><textarea id="memo" rows="3" placeholder="운동 당시 상태, 불편한 점">${esc(prev?.memo||'')}</textarea></div></div><div id="form-error" class="tiny" style="color:#b33" role="alert"></div><button class="btn" onclick="submitRecord()">${prev?'수정 내용 저장':'운동 기록 저장하기'}</button>`}
function submitRecord(){const n=id=>Number($('#'+id).value),sets=n('sets'),reps=n('reps'),before=n('before'),after=n('after');if(![sets,reps,before,after].every(Number.isInteger)||sets<1||sets>100||reps<1||reps>1000||before<0||before>10||after<0||after>10||['sets','reps','before','after'].some(id=>$('#'+id).value.trim()==='')){$('#form-error').textContent='세트·횟수는 양의 정수, 통증 점수는 0~10 정수로 입력해 주세요.';return}let symptoms=['tingling','back','none'].filter(x=>$('#'+x).checked);if(symptoms.includes('none'))symptoms=['none'];const r=records(),old=editing?r.find(x=>x.id===editing):null;const obj={id:old?.id||String(Date.now()),date:old?.date||stamp(),updatedAt:stamp(),exercise:old?.exercise||selected,sets,reps,before,after,symptoms,memo:$('#memo').value.trim()};if(old)r.splice(r.indexOf(old),1,obj);else r.unshift(obj);try{saveRecords(r);lastId=obj.id;editing=null;go('success')}catch(e){$('#form-error').textContent='저장하지 못했습니다. 저장 공간을 확인하고 다시 시도해 주세요. 입력값은 유지됩니다.'}}
function success(){let r=records().find(x=>x.id===lastId)||records()[0];return `<div class="success"><div class="check">✓</div><h1>운동 기록이 완료되었어요!</h1><p>오늘의 기록을 브라우저에 저장했어요.</p></div>${r?`<div class="card"><b>운동 기록 요약</b><div class="flex between"><span>${esc(ex(r.exercise).name)}</span><b>${r.sets}세트 × ${r.reps}회</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="flex between"><span>운동 전 통증</span><b>${r.before}/10</b></div><div class="flex between"><span>운동 후 통증</span><b>${r.after}/10</b></div></div>`:''}<button class="btn" onclick="go('home')">홈으로 돌아가기</button><button class="btn alt" onclick="go('history')">내 기록 확인하기</button>`}
function chart(r){let recent=[...r].reverse().slice(-7);if(!recent.length)return '<div class="notice">저장된 통증 기록이 없습니다. 운동 기록을 남기면 여기에 표시됩니다.</div>';const coords=(key)=>recent.map((x,i)=>[28+i*(295/Math.max(1,recent.length-1)),150-x[key]*12]);const poly=key=>coords(key).map(([x,y])=>`${x},${y}`).join(' ');return `<svg viewBox="0 0 345 190" class="linechart" role="img" aria-label="운동 전후 통증 점수 그래프"><g stroke="#e6eeeb" stroke-width="1">${[30,90,150].map(y=>`<line x1="28" x2="330" y1="${y}" y2="${y}"/>`).join('')}</g><g font-size="10" fill="#8da49e"><text x="4" y="34">10</text><text x="11" y="94">5</text><text x="11" y="154">0</text></g><polyline fill="none" stroke="#008578" stroke-width="2.5" points="${poly('before')}"/><polyline fill="none" stroke="#7faba2" stroke-width="2.5" stroke-dasharray="5 3" points="${poly('after')}"/>${coords('before').map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#008578"/>`).join('')}${coords('after').map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#7faba2"/>`).join('')}<g font-size="9" fill="#819591">${recent.map((a,i)=>`<text x="${28+i*(295/Math.max(1,recent.length-1))}" y="176" text-anchor="middle">${new Date(a.date).getMonth()+1}/${new Date(a.date).getDate()}</text>`).join('')}</g></svg><div class="tiny muted" style="text-align:center">━━ 운동 전 &nbsp;&nbsp; ┄┄ 운동 후 · 가상 회복 판정 없음</div>`}
function history(){const r=records();const cards=r.map(x=>{const symptoms=x.symptoms.map(y=>({tingling:'다리 저림',back:'허리 불편감',none:'특이사항 없음'}[y])).join(', ')||'증상 미선택';return `<div class="card"><div class="flex between"><b>${esc(ex(x.exercise).name)}</b><span class="tiny muted">${fmt(x.date)}</span></div><p class="sub">${x.sets}세트 × ${x.reps}회 · 운동 전 ${x.before}점 → 운동 후 ${x.after}점</p><p class="sub">${symptoms}${x.memo?' · '+esc(x.memo):''}</p><div class="row-actions"><button class="smallbtn" onclick="editing='${x.id}';selected='${x.exercise}';go('record')">수정</button><button class="smallbtn" onclick="removeRecord('${x.id}')">삭제</button></div></div>`}).join('');return `<h1>나의 재활 기록</h1><p class="sub">기록한 운동과 전후 통증 변화를 확인하세요.</p><div class="statrow"><div class="card"><div class="tiny muted">총 운동 기록</div><div class="stat">${r.length}회</div></div><div class="card"><div class="tiny muted">최근 운동 후 통증</div><div class="stat">${r.length?r[0].after+'/10':'–'}</div></div></div><h2>최근 통증 기록</h2><div class="card">${chart(r)}</div><h2>최근 운동 기록</h2>${r.length?cards:'<div class="card"><p>아직 기록이 없습니다. 운동을 선택해 첫 기록을 남겨보시기 바랍니다.</p><button class="btn" onclick="go(\'home\')">운동 선택하기</button></div>'}<button class="smallbtn" style="margin-top:12px" onclick="resetDemo()">시연 기록 전체 초기화</button><p class="foot">시연용 로컬 저장: 동일 브라우저에만 남으며 로그인·AWS 저장은 지원하지 않습니다.</p>`}
function resetDemo(){if(!confirm('이 브라우저의 FITCORE 시연 기록을 모두 삭제할까요? 복구할 수 없습니다.'))return;try{localStorage.removeItem(KEY);lastId=null;editing=null;go('home')}catch{alert('초기화에 실패했습니다. 브라우저 저장소를 확인해 주세요.')}}function removeRecord(id){if(!confirm('이 운동 기록을 삭제할까요?'))return;try{saveRecords(records().filter(x=>x.id!==id));render()}catch{alert('삭제에 실패했습니다. 다시 시도해 주세요.')}}function render(){stopFlow();const views={home,purpose,gym,machine,detail,record,success,history};$('#app').innerHTML=(views[current]||home)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===current));if(current==='gym')drawGym();if(current==='detail'){if(ex(selected).type==='home'){hydrateRehab(selected)}else{loadSourceDetails(selected);loadFlowAnimation(selected)}}hydrateRehabCards()}render();
</script></body></html>
